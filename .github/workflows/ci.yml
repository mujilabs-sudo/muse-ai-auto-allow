name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest, icons, and syntax
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: Build extension ZIP package
        run: npm run zip

      - name: Upload extension ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-ai-auto-allow-extension
          path: dist/*.zip
          retention-days: 14
